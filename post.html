    <style>
        .post-article-wrap { max-width: 780px; margin: 0 auto; padding: 8rem 1.5rem 6rem; }
        .post-back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; margin-bottom: 2rem; font-family: var(--font-heading); font-size: 0.9rem; }

        .post-article-meta { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.75rem; }

        .post-breadcrumb li { display: flex; align-items: center; gap: 6px; }
        .post-breadcrumb li:not(:last-child)::after { content: '/'; color: var(--glass-border); margin-left: 6px; }
        .post-breadcrumb a { color: var(--text-secondary); text-decoration: none; }
        .post-breadcrumb a:hover { color: var(--primary); }
        .post-breadcrumb li[aria-current="page"] { color: var(--text-primary); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
